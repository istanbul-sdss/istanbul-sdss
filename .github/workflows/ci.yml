name: CI

# Push'larda ve pull request'lerde test koşturulur. main dışındaki branch'lere
# de uygulanır ki feature branch'leri merge'den önce yeşil görünsün.
on:
  push:
    branches: [main, master]
  pull_request:

# Aynı branch'e arka arkaya push gelirse eski koşumları iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6.0,<1.0"
      - name: Run ruff check
        # pyproject.toml [tool.ruff] config'i otomatik bulunur.
        # Baseline temiz; herhangi bir yeni lint hatası CI'ı düşürür.
        run: ruff check .

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # 3.12 added: GeoPandas 1.0 / Shapely 2.0 / pandas 2.x all support it.
        # Keeping 3.10/3.11 in matrix to catch any regressions that creep in
        # for users on older interpreters.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # GeoPandas + Shapely için sistem GEOS/PROJ gerekiyor; Ubuntu image
      # çoğu wheel'i hazır sağlıyor ama GDAL/PROJ runtime için belge.
      - name: Install system geo libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest + coverage
        # -p no:cacheprovider: CI'da .pytest_cache permission/checkout sorunları
        # çıkmasın. --strict-markers: bilinmeyen marker'ı sessizce yutmayalım.
        # --cov: src/ + components/ kapsamı term-missing modunda; pages/ Streamlit
        # entry'leri için ayrı AppTest smoke (Faz 1, B2) gelecek.
        # XML çıktısı: artifact upload + ileride Codecov entegrasyonu için.
        run: |
          python -m pytest tests/ -v --strict-markers -p no:cacheprovider \
            --cov=src --cov=components \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  smoke:
    name: Streamlit smoke import
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system geo libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Streamlit `script_run` import'u gerektirmiyor; modül seviyesinde
      # syntax/Streamlit-API hatalarını yakalar. Asıl rendering test için
      # AppTest ile pytest içinden gerçek smoke yazılabilir (Faz 3 ileri ucu).
      - name: Static import check (compile)
        run: |
          python -m compileall -q \
            Spatial_Data_Collection_Tool.py \
            Optimization_Tool.py \
            pages/ components/ src/
