[pytest]
# Test ayarları — minimum yapılandırma; CI ve yerel ortam aynı davranır.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# H6: pyproj 3.7 + numpy 2.x + geopandas 1.1 birleşiminde tek-noktalı
# `to_crs` çağrısı `_transform_point` üzerinden ndim>0 array'i scalar
# bağlamında alıp DeprecationWarning üretiyor. Bizim kodumuzda yapısal
# (representative_point UTM→WGS84 round-trip); upstream pyproj/geopandas
# fix gelince bu filtre kaldırılmalı. Şimdilik test çıktısındaki 38
# gürültü satırını eler.
filterwarnings =
    ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning
